<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魔术计算器</title>
<meta name="description" content="春晚同款魔术计算器，仿小米手机原生计算器UI，支持真实运算，隐藏魔术功能让你变身数学魔术师！">
<meta name="keywords" content="魔术计算器,春晚魔术,计算器魔术揭秘,小米计算器,数学魔术,在线计算器">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calculator">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="time" id="statusTime"></span>
    <div class="icons">
      <svg viewBox="0 0 24 24" fill="white"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24" fill="white"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4zM13 18h-2v-2h2v2zm0-4h-2V9h2v5z"/></svg>
    </div>
  </div>

  <!-- 隐蔽的锁定指示器 -->
  <div class="lock-indicator" id="lockIndicator"></div>

  <!-- 显示区域 -->
  <div class="display-area">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- 按钮区域 -->
  <div class="buttons">
    <button class="btn btn-clear btn-func" id="btnClear" data-action="clear">AC</button>
    <button class="btn btn-func btn-backspace" data-action="backspace">
      <svg viewBox="0 0 24 24" fill="white"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
    </button>
    <button class="btn btn-func btn-percent" data-action="percent">%</button>
    <button class="btn btn-op" data-action="operator" data-value="÷">÷</button>

    <button class="btn btn-number" data-action="number" data-value="7">7</button>
    <button class="btn btn-number" data-action="number" data-value="8">8</button>
    <button class="btn btn-number" data-action="number" data-value="9">9</button>
    <button class="btn btn-op" data-action="operator" data-value="×">×</button>

    <button class="btn btn-number" data-action="number" data-value="4">4</button>
    <button class="btn btn-number" data-action="number" data-value="5">5</button>
    <button class="btn btn-number" data-action="number" data-value="6">6</button>
    <button class="btn btn-op" data-action="operator" data-value="-">−</button>

    <button class="btn btn-number" data-action="number" data-value="1">1</button>
    <button class="btn btn-number" data-action="number" data-value="2">2</button>
    <button class="btn btn-number" data-action="number" data-value="3">3</button>
    <button class="btn btn-op" data-action="operator" data-value="+">+</button>

    <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
    <button class="btn btn-number" data-action="number" data-value=".">.</button>
    <button class="btn btn-equals" data-action="equals">=</button>
  </div>

  
</div>

<script src="script.js"></script>
</body>
</html>
