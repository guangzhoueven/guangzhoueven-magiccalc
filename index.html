<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>魔术计算器</title>
<meta name="description" content="春晚同款魔术计算器，仿小米手机原生计算器UI，支持真实运算，隐藏魔术功能让你变身数学魔术师！">
<meta name="keywords" content="魔术计算器,春晚魔术,计算器魔术揭秘,小米计算器,数学魔术,在线计算器">

<!-- PWA Meta Tags -->
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="魔术计算器">
<meta name="application-name" content="魔术计算器">
<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-config" content="browserconfig.xml">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.svg">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calculator">
  <!-- 状态栏 -->
  <div class="status-bar">
    <div class="icons">
      <span class="carrier-info">中国移动 </span>
      <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 24 24" fill="white"><g fill="none"><path d="M12.896 3.62v-.002l-.002-.002l-.002-.004l-.006-.01a1.031 1.031 0 0 0-.056-.081a1.727 1.727 0 0 0-.134-.161a2.134 2.134 0 0 0-.514-.397c-.476-.266-1.155-.425-2.068-.258c-1.091.2-1.63.97-1.875 1.597A3.6 3.6 0 0 0 8 5.459v.026L8 5.494V6.75a2.5 2.5 0 0 0 2.5 2.5h.25a2.5 2.5 0 0 0 2.5-2.5v-.5a.75.75 0 0 0-.75-.75h-1.25a.75.75 0 0 0 0 1.5h.469a1 1 0 0 1-.969.75h-.25a1 1 0 0 1-1-1V5.501l.002-.034a2.1 2.1 0 0 1 .134-.62c.13-.332.341-.591.75-.666c.597-.11.917.01 1.064.091a.64.64 0 0 1 .17.134a.75.75 0 0 0 1.277-.786z" fill="currentColor"></path><path d="M4 2.75a.75.75 0 0 0-.745.667l-.25 2.25a.75.75 0 0 0 .88.82l1.006-.182a.728.728 0 1 1 .13 1.445h-.218a.75.75 0 0 1-.624-.334l-.055-.082a.75.75 0 0 0-1.248.832l.055.082A2.25 2.25 0 0 0 4.803 9.25h.219a2.228 2.228 0 1 0-.399-4.421l-.016.003l.064-.582h1.83a.75.75 0 0 0 0-1.5H4z" fill="currentColor"></path><path d="M21 7a1 1 0 0 0-2 0v13a1 1 0 0 0 2 0V7z" fill="currentColor"></path><path d="M17 9.995A.998.998 0 0 0 16 9c-.552 0-1 .446-1 .995v10.01c0 .55.448.995 1 .995s1-.446 1-.995V9.995z" fill="currentColor"></path><path d="M13 13a1 1 0 1 0-2 0v7a1 1 0 1 0 2 0v-7z" fill="currentColor"></path><path d="M9 15.994A.997.997 0 0 0 8 15c-.552 0-1 .445-1 .994v4.012c0 .549.448.994 1 .994s1-.445 1-.994v-4.012z" fill="currentColor"></path><path d="M5 18.984A.992.992 0 0 0 4 18c-.552 0-1 .44-1 .984v1.032c0 .544.448.984 1 .984s1-.44 1-.984v-1.032z" fill="currentColor"></path></g></svg>
      <svg viewBox="0 0 24 24" fill="white"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    </div>
    <div class="status-right">
      <div class="icons battery-icon">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 512 512" enable-background="new 0 0 512 512" xml:space="preserve" fill="white"><g><path d="M396,144H64c-26.4,0-48,21.6-48,48v128c0,26.4,21.6,48,48,48h332c26.4,0,48-21.6,48-48V192C444,165.6,422.4,144,396,144z
		 M416,320c0,11-9,20-20,20H64c-11,0-20-9-20-20V192c0-11,9-20,20-20h332c11,0,20,9,20,20V320z"></path><path d="M464,204.6v102.8c16,0,32-27.7,32-51.4C496,232.3,480,204.6,464,204.6z"></path><path d="M384,192H76c-6.6,0-12,5.4-12,12v104c0,6.6,5.4,12,12,12h308c6.6,0,12-5.4,12-12V204C396,197.4,390.6,192,384,192z"></path></g></svg>
      </div>
      <span class="time" id="statusTime"></span>
    </div>
  </div>

  <!-- 隐蔽的锁定指示器 -->
  <div class="lock-indicator" id="lockIndicator"></div>

  <!-- 显示区域 -->
  <div class="display-area">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- 按钮区域 -->
  <div class="buttons">
    <button class="btn btn-clear btn-func" id="btnClear" data-action="clear">AC</button>
    <button class="btn btn-func btn-backspace" data-action="backspace">
      <svg viewBox="0 0 24 24" fill="white"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
    </button>
    <button class="btn btn-func btn-percent" data-action="percent">%</button>
    <button class="btn btn-op" data-action="operator" data-value="÷">÷</button>

    <button class="btn btn-number" data-action="number" data-value="7">7</button>
    <button class="btn btn-number" data-action="number" data-value="8">8</button>
    <button class="btn btn-number" data-action="number" data-value="9">9</button>
    <button class="btn btn-op" data-action="operator" data-value="×">×</button>

    <button class="btn btn-number" data-action="number" data-value="4">4</button>
    <button class="btn btn-number" data-action="number" data-value="5">5</button>
    <button class="btn btn-number" data-action="number" data-value="6">6</button>
    <button class="btn btn-op" data-action="operator" data-value="-">−</button>

    <button class="btn btn-number" data-action="number" data-value="1">1</button>
    <button class="btn btn-number" data-action="number" data-value="2">2</button>
    <button class="btn btn-number" data-action="number" data-value="3">3</button>
    <button class="btn btn-op" data-action="operator" data-value="+">+</button>

    <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
    <button class="btn btn-number" data-action="number" data-value=".">.</button>
    <button class="btn btn-equals" data-action="equals">=</button>
  </div>

  
</div>

<script src="script.js"></script>

<!-- PWA Service Worker Registration -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(registration) {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
      })
      .catch(function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
  });
}
</script>

</body>
</html>
